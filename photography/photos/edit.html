<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mountain — Photography — Ross Bower</title>
<link rel="stylesheet" href="../assets/site.css">
<style>
    body { --bg1: #0e2c39; --bg2: #1d5872; --accent: #84b6d7; --ambient-text: #f5f5f5; }
</style>
</head>
<body class="detail-page">
    <header class="site-header">
        <a class="back-link" href="../index.html">&larr; Photography</a>
        <a class="back-link" href="https://rossbower.com">rossbower.com &rarr;</a>
    </header>
    <main class="detail">
        <div class="photo-stage">
            <span class="stage-nav stage-nav-prev disabled" aria-label="No newer photo">&lsaquo;</span>
            <figure class="detail-figure">
                <img src="../images/large/edit.jpg" alt="Mountain">
            </figure>
            <span class="stage-nav stage-nav-next disabled" aria-label="No older photo">&rsaquo;</span>
        </div>
        <div class="detail-body">
            <h1>Mountain</h1>
            <div class="meta-row">
                <span class="meta-date">2026-07-07</span>
                <span class="meta-dims">2400 &times; 1472</span>
            </div>
            
            <div class="exif-grid">
                <div class="exif-item"><span class="exif-label">Camera</span><span>Apple iPhone 17 Pro</span></div>
                <div class="exif-item"><span class="exif-label">Lens</span><span>iPhone 17 Pro back triple camera 16.891mm f/2.8</span></div>
                <div class="exif-item"><span class="exif-label">Aperture</span><span>f/2.8</span></div>
                <div class="exif-item"><span class="exif-label">Shutter Speed</span><span>1/121s</span></div>
                <div class="exif-item"><span class="exif-label">ISO</span><span>ISO 80</span></div>
                <div class="exif-item"><span class="exif-label">Focal Length</span><span>16.8906mm</span></div>
                <div class="exif-item"><span class="exif-label">Date Taken</span><span>2026-07-07 20:57:10</span></div>
            </div>
            <div class="swatch-row">
                <button class="swatch" style="background:#d5cba5;color:#1a1a1a"
                        data-hex="#d5cba5" title="Dominant — #d5cba5 (click to copy)">
                    <span>#d5cba5</span>
                </button>
                <button class="swatch" style="background:#275776;color:#f5f5f5"
                        data-hex="#275776" title="Vibrant — #275776 (click to copy)">
                    <span>#275776</span>
                </button>
                <button class="swatch" style="background:#f5e7a4;color:#1a1a1a"
                        data-hex="#f5e7a4" title="Light Vibrant — #f5e7a4 (click to copy)">
                    <span>#f5e7a4</span>
                </button>
                <button class="swatch" style="background:#024a69;color:#f5f5f5"
                        data-hex="#024a69" title="Dark Vibrant — #024a69 (click to copy)">
                    <span>#024a69</span>
                </button>
                <button class="swatch" style="background:#79a6b8;color:#f5f5f5"
                        data-hex="#79a6b8" title="Muted — #79a6b8 (click to copy)">
                    <span>#79a6b8</span>
                </button>
            </div>
            <div class="download-row">
                <span class="download-label">Download</span>
                <a class="download-link" href="../images/small/edit.jpg" download title="≤800px">Small</a>
                <a class="download-link" href="../images/medium/edit.jpg" download title="≤1600px">Medium</a>
                <a class="download-link" href="../images/large/edit.jpg" download title="≤2400px">Large</a>
                <a class="download-link" href="../images/original/edit.jpeg" download title="original uploaded file, full resolution 2400×1472">Full Size</a>
            </div>
        </div>

    </main>
    <footer class="site-footer">&copy; Ross Bower</footer>
    <script>
        document.querySelectorAll('.swatch').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var hex = btn.getAttribute('data-hex');
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(hex);
                }
                var label = btn.querySelector('span');
                var original = label.textContent;
                label.textContent = 'Copied!';
                setTimeout(function() { label.textContent = original; }, 900);
            });
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') {
                var prev = document.querySelector('.stage-nav-prev:not(.disabled)');
                if (prev) prev.click();
            } else if (e.key === 'ArrowRight') {
                var next = document.querySelector('.stage-nav-next:not(.disabled)');
                if (next) next.click();
            }
        });
    </script>
</body>
</html>
